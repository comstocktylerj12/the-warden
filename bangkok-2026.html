<title>Bangkok Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block">
<style>
:root{
  --bg:#F1F6FC; --bg2:#E7EFF9; --surf:#FFFFFF; --surf2:#F6F9FD; --surf3:#EDF2F9;
  --line:#E3EBF4; --line2:#CFDCEA;
  --ink:#152338; --ink2:#5C6D85; --ink3:#93A3B8;
  --coral:#FF6B4A; --coral-s:#FFEDE8;
  --teal:#0FB5A5;  --teal-s:#DFF6F3;
  --amber:#E0951C; --amber-s:#FDF0D8;
  --violet:#7C6BF5;--violet-s:#EBE8FE;
  --blue:#3B9FE0;  --blue-s:#E2F1FB;
  --pink:#EC6F9E;  --pink-s:#FCE7EF;
  --navy:#14314F;
  --good:#12A05F;  --good-s:#DEF3E8;
  --warn:#D9861B;  --warn-s:#FDF0DC;
  --crit:#E5484D;  --crit-s:#FDE8E8;
  --sh1:0 1px 2px rgba(21,35,56,.04), 0 2px 8px rgba(21,35,56,.05);
  --sh2:0 2px 6px rgba(21,35,56,.05), 0 12px 28px rgba(21,35,56,.08);
  --r-s:12px; --r-m:18px; --r-l:24px; --r-xl:30px;
  --disp:'Outfit','Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --bg2:#131E30; --surf:#18243A; --surf2:#1E2B43; --surf3:#25344F;
  --line:#25344F; --line2:#33455F;
  --ink:#EAF1FA; --ink2:#A3B4CA; --ink3:#72859E;
  --coral:#FF8265; --coral-s:#3A2118;
  --teal:#3FD3C2;  --teal-s:#0F2E2C;
  --amber:#F5BC55; --amber-s:#332615;
  --violet:#A394FF;--violet-s:#241F45;
  --blue:#6BBDF0;  --blue-s:#132C40;
  --pink:#F58CB4;  --pink-s:#361E2A;
  --navy:#E8F0FA;
  --good:#3FC98A;  --good-s:#0F2C1F;
  --warn:#F0A947;  --warn-s:#332616;
  --crit:#FF7175;  --crit-s:#3A1B1D;
  --sh1:0 1px 2px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.22);
  --sh2:0 2px 6px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.34);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1726; --bg2:#131E30; --surf:#18243A; --surf2:#1E2B43; --surf3:#25344F;
  --line:#25344F; --line2:#33455F;
  --ink:#EAF1FA; --ink2:#A3B4CA; --ink3:#72859E;
  --coral:#FF8265; --coral-s:#3A2118;
  --teal:#3FD3C2;  --teal-s:#0F2E2C;
  --amber:#F5BC55; --amber-s:#332615;
  --violet:#A394FF;--violet-s:#241F45;
  --blue:#6BBDF0;  --blue-s:#132C40;
  --pink:#F58CB4;  --pink-s:#361E2A;
  --navy:#E8F0FA;
  --good:#3FC98A;  --good-s:#0F2C1F;
  --warn:#F0A947;  --warn-s:#332616;
  --crit:#FF7175;  --crit-s:#3A1B1D;
  --sh1:0 1px 2px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.22);
  --sh2:0 2px 6px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.34);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- material symbols ---------- */
html:not(.mi-ok) .mi{display:none!important}
html:not(.mi-ok) .btile .bi,html:not(.mi-ok) .media{display:none}
.mi{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  font-size:22px;vertical-align:middle;flex-shrink:0}
.mi.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.mi.sm{font-size:18px}
.mi.xs{font-size:15px}
.mi.lg{font-size:28px}
.mi.xl{font-size:38px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:780px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden}
.logomark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,var(--coral),#FF9A6B);color:#fff;box-shadow:0 3px 10px rgba(255,107,74,.32)}
.logotext{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.logotext small{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.04em;
  color:var(--ink3);margin-top:1px;text-transform:uppercase}
.topright{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
.wxpill{display:flex;align-items:center;gap:5px;background:var(--surf);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px 5px 8px;font-family:var(--mono);font-size:12.5px;font-weight:500;
  box-shadow:var(--sh1);white-space:nowrap}
.wxpill .mi{font-size:16px;color:var(--blue)}
.iconbtn{background:var(--surf);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;box-shadow:var(--sh1);color:var(--ink2)}
.iconbtn:active{transform:scale(.95)}
.sosbtn{background:var(--crit);color:#fff;border:0;border-radius:12px;height:40px;padding:0 13px;
  display:flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:700;font-size:13px;
  cursor:pointer;flex-shrink:0;box-shadow:0 3px 10px rgba(229,72,77,.3)}
.sosbtn:active{transform:scale(.96)}

/* mode strip */
.modestrip{display:flex;align-items:center;gap:8px;padding:8px 16px;max-width:780px;margin:0 auto;
  font-size:12.5px;border-top:1px solid var(--line)}
.modestrip .mi{font-size:17px}
.modestrip .lbl{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.modestrip .msg{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.m-NORMAL{background:var(--surf2)}   .m-NORMAL .lbl,.m-NORMAL .mi{color:var(--ink2)}
.m-DRY{background:var(--good-s)}     .m-DRY .lbl,.m-DRY .mi{color:var(--good)}
.m-RAIN{background:var(--blue-s)}    .m-RAIN .lbl,.m-RAIN .mi{color:var(--blue)}
.m-HEAVY{background:var(--crit-s)}   .m-HEAVY .lbl,.m-HEAVY .mi{color:var(--crit)}
.m-HEAT{background:var(--warn-s)}    .m-HEAT .lbl,.m-HEAT .mi{color:var(--warn)}

main{flex:1;width:100%;max-width:780px;margin:0 auto;padding:18px 16px 112px}

/* ---------- bottom nav (phone/small screens) ---------- */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;overflow:visible;
  background:var(--surf);
  background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabscroll{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;overflow:visible;
  padding:6px 6px 4px;max-width:780px;margin:0 auto}
.tab{background:none;border:0;border-radius:14px;padding:6px 4px;min-height:52px;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;cursor:pointer;
  color:var(--ink3);font-family:var(--body);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab .mi{font-size:23px}
.tab[aria-selected="true"]{color:var(--coral)}
.tab[aria-selected="true"] .mi{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.tab .lbl{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}

/* the primary (Explore) action sits proud of the bar, like a raised FAB */
.tab.fab{overflow:visible}
.tab.fab .fabin{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#FF8A63,var(--coral));color:#fff;margin-top:-28px;
  box-shadow:0 8px 20px rgba(255,107,74,.46),0 2px 6px rgba(255,107,74,.28);
  border:4px solid var(--surf);transition:transform .15s ease}
.tab.fab .fabin .mi{font-size:26px;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;color:#fff}
.tab.fab:active .fabin{transform:scale(.92)}
.tab.fab[aria-selected="true"] .fabin{box-shadow:0 10px 24px rgba(255,107,74,.58),0 0 0 4px var(--coral-s)}

/* ---------- top nav (large screens): hamburger replaces the bottom bar ---------- */
.hamburgerbtn{display:none}
@media (min-width:900px){
  nav#tabs{display:none}
  main{padding-bottom:26px}
  .hamburgerbtn{display:grid}
}

/* ---------- type ---------- */
/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.025em;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700;letter-spacing:-.015em}
h4{font-size:14px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2);font-size:14px}
.tiny{font-size:12.5px;color:var(--ink2);line-height:1.5}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{margin:0 0 28px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sechead h2{flex:1;min-width:0}
.sechead .n{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);background:var(--surf3);padding:4px 9px;border-radius:999px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- cards ---------- */
.card{background:var(--surf);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh1)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.pad-s{padding:13px}

/* hero */
.hero{border-radius:var(--r-xl);padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#2A6FA8 0%,#3B9FE0 45%,#4FC3D9 100%);box-shadow:var(--sh2)}
.hero::after{content:'';position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.hero .mi{color:rgba(255,255,255,.92)}
.hero .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;z-index:1}
.hero .heye{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.hero h1{color:#fff;margin-top:5px;font-size:27px}
.hero .hsub{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13.5px;opacity:.92;font-weight:500}
.hclock{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums}
.hclock-s{font-family:var(--mono);font-size:11px;opacity:.8;margin-top:5px;display:block;text-align:right}

/* stat grid inside hero */
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:9px;margin-top:17px;position:relative;z-index:1}
.hstat{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-m);
  padding:10px 11px;backdrop-filter:blur(6px);min-width:0}
.hstat .k{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.82;display:block}
.hstat .v{font-family:var(--mono);font-size:15.5px;font-weight:500;display:block;margin-top:3px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat .s{font-size:10.5px;opacity:.78;display:block;line-height:1.3}
.hstat.money{cursor:pointer;border:0;background:rgba(255,255,255,.17);text-align:left;width:100%;
  font:inherit;transition:transform .12s ease}
.hstat.money:active{transform:scale(.96)}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btile{border-radius:var(--r-l);padding:15px;border:0;cursor:pointer;text-align:left;display:flex;
  flex-direction:column;gap:9px;min-height:104px;font-family:var(--body);box-shadow:var(--sh1);
  justify-content:space-between;color:var(--ink)}
.btile:active{transform:scale(.982)}
.btile .bi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.62)}
.btile .bd{display:flex;flex-direction:column;gap:3px;min-width:0}
.btile .bt{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.015em}
.btile .bs{font-size:11.5px;color:var(--ink2);line-height:1.35}
.btile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:13px}
.btile.wide .bd{flex:1;min-width:0}
.t-violet{background:var(--violet-s)} .t-violet .bi{color:var(--violet)}
.t-amber{background:var(--amber-s)}   .t-amber .bi{color:var(--amber)}
.t-teal{background:var(--teal-s)}     .t-teal .bi{color:var(--teal)}
.t-coral{background:var(--coral-s)}   .t-coral .bi{color:var(--coral)}
.t-blue{background:var(--blue-s)}     .t-blue .bi{color:var(--blue)}
.t-pink{background:var(--pink-s)}     .t-pink .bi{color:var(--pink)}
:root[data-theme="dark"] .btile .bi,:root:not([data-theme="light"]) .btile .bi{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btile .bi{background:rgba(255,255,255,.62)}}

/* sub-tabs inside a hub screen */
.subtabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);
  border-radius:999px;padding:9px 15px;min-height:44px;cursor:pointer;color:var(--ink2);
  font-family:var(--body);font-weight:600;font-size:13.5px;box-shadow:var(--sh1)}
.subtab .mi{font-size:18px}
.subtab[aria-selected="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}

/* slide-out menu */
#menuview{position:fixed;inset:0;z-index:190;background:var(--bg);overflow-y:auto;
  padding:16px 16px calc(30px + env(safe-area-inset-bottom,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  animation:slideIn .22s cubic-bezier(.22,.7,.3,1)}
@keyframes slideIn{from{transform:translateX(12%);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#menuview{animation:none}}
.menugroup{margin-bottom:22px}
.menugroup>.eyebrow{display:block;margin-bottom:9px}
.menulist{display:flex;flex-direction:column;background:var(--surf);border-radius:var(--r-l);
  overflow:hidden;box-shadow:var(--sh1)}
.menuitem{display:flex;align-items:center;gap:13px;padding:14px 15px;border:0;background:none;width:100%;
  text-align:left;cursor:pointer;font-family:var(--body);color:var(--ink);min-height:60px;
  border-bottom:1px solid var(--line);text-decoration:none}
.menuitem:last-child{border-bottom:0}
.menuitem:active{background:var(--surf2)}
.menuitem .mt{flex:1;min-width:0}
.menuitem .ml{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;display:block}
.menuitem .ms{font-size:12px;color:var(--ink2);display:block;margin-top:1px}
.menuitem .mi.chev{color:var(--ink3);font-size:20px}
.menuitem.danger .ml{color:var(--crit)}

/* day pills */
.daytabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;margin-bottom:4px}
.daytabs::-webkit-scrollbar{display:none}
.daypill{flex:0 0 auto;border:1px solid var(--line);background:var(--surf);border-radius:16px;
  padding:9px 14px;cursor:pointer;text-align:center;min-width:66px;font-family:var(--body);
  color:var(--ink2);box-shadow:var(--sh1)}
.daypill .d{font-family:var(--disp);font-weight:700;font-size:13.5px;display:block;color:var(--ink)}
.daypill .m{font-size:11px;display:block;margin-top:1px;font-weight:500}
.daypill[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff;
  box-shadow:0 4px 14px rgba(255,107,74,.34)}
.daypill[aria-pressed="true"] .d{color:#fff}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column}
.tlrow{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.tlnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-family:var(--disp);font-weight:700;font-size:13px;margin-top:3px;box-shadow:var(--sh1)}
.n-violet{background:var(--violet)} .n-amber{background:var(--amber)} .n-teal{background:var(--teal)}
.n-coral{background:var(--coral)}   .n-blue{background:var(--blue)}   .n-pink{background:var(--pink)}
.tlcard{background:var(--surf);border-radius:var(--r-l);padding:0;box-shadow:var(--sh1);overflow:hidden;min-width:0}
.tlhead{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
.media{width:60px;height:60px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--g1),var(--g2))}
.media.sm{width:46px;height:46px;border-radius:13px}
.g-violet{--g1:#A394FF;--g2:#7C6BF5} .g-amber{--g1:#FBC66B;--g2:#EDA22B}
.g-teal{--g1:#5FDBCB;--g2:#0FB5A5}   .g-coral{--g1:#FF9E80;--g2:#FF6B4A}
.g-blue{--g1:#7CC8F2;--g2:#3B9FE0}   .g-pink{--g1:#F9A8C4;--g2:#EC6F9E}
.tlhead .th{flex:1;min-width:0}
.tltime{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--coral);display:flex;align-items:center;gap:4px}
.tlhead h3{margin-top:2px}
.tlbody{padding:0 14px 14px;border-top:1px solid var(--line);margin-top:0;padding-top:12px}
.tllink{display:flex;align-items:center;gap:7px;padding:9px 0 9px 44px;font-size:12px;color:var(--ink3);font-weight:600}
.tllink .mi{font-size:16px;color:var(--ink3)}
.tlspine{width:2px;background:var(--line2);height:100%;margin:0 auto}

/* chips */
.chip.money{cursor:pointer;border:0;font:inherit;transition:transform .12s ease}
.chip.money:active{transform:scale(.93)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;
  border-radius:999px;background:var(--surf3);color:var(--ink2);white-space:nowrap}
.chip .mi{font-size:14px}
.chip.coral{background:var(--coral-s);color:var(--coral)}
.chip.teal{background:var(--teal-s);color:var(--teal)}
.chip.amber{background:var(--amber-s);color:var(--amber)}
.chip.violet{background:var(--violet-s);color:var(--violet)}
.chip.blue{background:var(--blue-s);color:var(--blue)}

'2026-09-28':{
  title:'Near-Field Evening', dow:'Monday', theme:'Everything within ten minutes of your door.',

  seq:[
   {t:'15:45',b:'Open this app. Check the <b>mode strip</b> at the top — if it says RAIN, use the backup line in each block below.'},
   {t:'16:00',b:'Finish up. You are already in the right district — no transit required.'},
   {t:'16:20',b:'Back at the hotel. <b>Shower and change.</b> Long trousers or smart shorts; a collared shirt or a decent tee. Closed shoes — Red Sky will turn away sandals.'},
   {t:'17:15',b:'Walk out. Ploenchit Road, head west toward the Ratchaprasong intersection.'}
  ],
  blocks:[
   {t:'17:30',dur:'25 min',name:'Erawan Shrine',loc:'Ratchaprasong intersection, 5 min walk',

    trans:'Walk. West on Ploenchit, past Gaysorn. It is on the corner.',tt:'5 min',cost:'Free; ฿50–100 for incense and a garland if you want to participate',
    todo:'Buy a set of offerings from the stalls. Light the incense, hold it between your palms at forehead height, bow three times. Circle the shrine clockwise. Watch the dancers for a few minutes.',
    order:'—',wear:'Cover your shoulders and knees. Remove your hat.',
    resv:'None',wx:'Covered on three sides — fine in moderate rain.',
    backup:'If it is pouring, go straight to dinner and come back another evening — it is open until 23:00 every night of your trip.',
    next:'Walk 90 seconds to the Grand Hyatt Erawan.'},
   {t:'18:15',dur:'75 min',name:'Dinner — Erawan Tea Room',loc:'Grand Hyatt Erawan, 2 min walk',
    why:'A hotel-operated Thai room with the spice dialled to where a cautious first-timer can actually taste the dish instead of surviving it. Open until 22:00, walk-in friendly, and completely unbothered by a solo diner.',

    todo:'Ask for a table, not the counter. Order one curry, one salad, one rice.',

    next:'Walk to Centara Grand at CentralWorld.'},

'2026-09-29':{
  title:'Old City Arc', dow:'Tuesday', theme:'The one evening a real temple is open — then the river at night.',
  brief:'This is the most important evening of your trip and the most physically demanding. Wat Saket is the only major temple in Bangkok plausibly open past 18:00, and it happens to have the best sunset view in the city. You climb it at golden hour, then move west to the river for dinner facing an illuminated Wat Arun. One direction out, one car back. Eat before you climb if you are hungry — there is nothing at the top.',
  seq:[
   {t:'15:40',b:'<b>Check the mode strip.</b> Heavy rain kills this plan — the climb is exposed and the steps get slick. If it is red, run the RAIN LINE below instead.'},
   {t:'15:50',b:'<b>Call Wat Saket</b> or ask the hotel concierge to call: closing time is disputed across sources (17:00 vs 19:00 vs 20:00). One phone call removes the single biggest risk in this itinerary.'},
   {t:'16:00',b:'Free. Go straight to the hotel — do not detour.'},
   {t:'16:15',b:'<b>Change fast.</b> Lightweight trousers, breathable shirt, real shoes with grip. Take water. Take a hand towel — you will be soaked by the top.'},
   {t:'16:35',b:'<b>Open Grab.</b> Destination: Wat Saket / Golden Mount, Boriphat Road. Show the driver the Thai address card. Expect ฿150–250 and 35–50 minutes in Tuesday traffic.'},
   {t:'16:45',b:'<b>Depart.</b> If Grab quotes over ฿400 or a 15-minute wait, take BTS Chit Lom → Phaya Thai and pick up a car there instead.'}
  ],
  blocks:[
   {t:'17:25',dur:'70 min',name:'Wat Saket — the Golden Mount',loc:'Boriphat Road, Old City',
    why:'An artificial hill raised over the ruins of a collapsed chedi, wrapped by 344 steps that spiral through shade trees and bells. At the top: a gold chedi and an unobstructed 360° view over the low rooftops of the Old City — no skyscrapers in the way, which is exactly why it beats every rooftop bar for photography. Sunset lands around 18:12.',
    trans:'Grab from the hotel.',tt:'35–50 min',cost:'฿100 entry + ฿150–250 Grab',
    todo:'Climb slowly — it is a ramp, not a scramble, but it is humid. Ring the bells on the way up. Be at the top by 17:55. Do a full circuit of the terrace before the sun goes; shoot west first, then turn east as the city lights come up.',
    order:'—',wear:'Shoulders and knees covered. Shoes you can climb in. Bring water.',
    resv:'None.',
    wx:'<b>The weak point of the whole week.</b> Fully exposed. Wet stone plus 344 steps is a genuine fall risk.',
    backup:'<b>RAIN LINE:</b> skip the climb entirely. Grab straight to Tha Tien for dinner (below) and see Wat Arun lit from a covered riverside table — you lose the temple, you keep the evening.',
    next:'Grab west to Tha Tien, 15–20 min.'},
   {t:'19:15',dur:'100 min',name:'Dinner facing Wat Arun — Sala Rattanakosin',loc:'Tha Tien riverfront',
    why:'A narrow boutique-hotel dining room that opens directly onto the river with Wat Arun floodlit dead ahead across the water. You cannot enter Wat Arun after 18:00 — but this is the view everyone photographs anyway, and you get it sitting down with a drink.',
    trans:'Grab from Wat Saket.',tt:'15–20 min',cost:'฿900–1,600',
    todo:'<b>Ask for a river-facing table when you book</b> — without one this is a normal restaurant. Rooftop bar upstairs if you want one more drink afterwards.',
    order:'Southern yellow curry, crab meat fried rice, a cold Singha. Keep it simple — you are here for the window.',
    wear:'Smart casual.',resv:'<b>Recommended — call or book online today.</b> River tables go first.',
    wx:'Covered. Works in any weather.',
    backup:'<b>The Deck by Arun Residence</b>, 3 min walk, same view. <b>Supanniga Eating Room Tha Tien</b>, better food, slightly less view.',
    next:'Grab home, 35–50 min, ฿200–300. You will be back by 21:45.'}
  ]
},

   {t:'17:00',b:'<b>Walk to BTS Chit Lom.</b> Exit the hotel, 3–5 minutes. Tap in with your Rabbit card.'},
   {t:'17:10',b:'<b>BTS Sukhumvit Line toward Kheha.</b> Chit Lom → Thong Lo is about 12 minutes. Stay on the train, not in a car — this is rush hour and the road is a parking lot.'},

/* =====================================================================
   ENGINES
   ===================================================================== */

/* ---------- storage (per-device only; never required) ---------- */
var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem('bkk26.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem('bkk26.'+k,JSON.stringify(v)); }catch(e){} }
};

/* ---------- Bangkok time (UTC+7, no DST — safe to hardcode the offset) ---------- */
function bkkFields(d){
  d = d || new Date();
  var f = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,weekday:'short'});
  var o={}; f.formatToParts(d).forEach(function(p){o[p.type]=p.value;});
  if(o.hour==='24') o.hour='00';
  return o;
}
function bkkISO(d){ var p=bkkFields(d); return p.year+'-'+p.month+'-'+p.day; }
function bkkMin(d){ var p=bkkFields(d); return (+p.hour)*60 + (+p.minute); }
function bkkHour(d){ return +bkkFields(d).hour; }
function bkkDow(d){ return new Date(bkkISO(d)+'T12:00:00+07:00').getUTCDay(); }
function stamp(iso,hhmm){ return Date.parse(iso+'T'+hhmm+':00+07:00'); }
function F(c){ return Math.round(c*9/5+32); }        /* °C → °F */
function inch(mm){ if(mm==null) return '—'; var i=mm/25.4; return (i<0.1?i.toFixed(2):i.toFixed(1))+'"'; }
/* 24h "17:30" → "5:30 PM". Times are stored in 24h and converted only for display. */
function t12(hhmm){
  var m=/^(\d{1,2}):(\d{2})$/.exec(String(hhmm).trim()); if(!m) return hhmm;
  var h=+m[1]; if(h>23) return hhmm;
  return (h%12||12)+':'+m[2]+'\u00A0'+(h>=12?'PM':'AM');
}
function hourShort(h){ return (h%12||12)+(h>=12?'p':'a'); }
/* Convert every 24h time in rendered HTML, skipping anything inside a tag so
   attribute values (input values, hrefs, inline styles) are never touched. */
function fixTimes(html){
  return html.replace(/(<[^>]*>)|([^<]+)/g, function(all,tag,text){
    if(tag) return tag;
    return text.replace(/(\d{1,2}):([0-5]\d)(?![\u00A0 ]?(AM|PM))(?![\d:])/g, function(str,h,mn){
      var H=+h; if(H>23) return str;
      return (H%12||12)+':'+mn+'\u00A0'+(H>=12?'PM':'AM');
    });
  });
}
/* ---------- currency toggle ----------
   Every price on the trip is authored in Thai baht, including narrative
   strings ("Free (\u0e3f50-100 for offerings)", "\u0e3f450-600", "\u0e3f60 flagfall; \u0e3f150-250 ...").
   Rather than add a parallel USD field to every data record, convert in
   place: this walks rendered HTML exactly like fixTimes (skipping tag
   interiors, so hrefs/attrs are untouched) and rewrites every \u0e3fN or \u0e3fN-N
   token to its dollar equivalent whenever the viewer has switched to USD.
   Tier symbols with no digit after them (\u0e3f\u0e3f\u0e3f) never match, so they are
   left alone in either mode. */
var CURR = 'THB';
function toggleCurrency(){
  CURR = (CURR==='THB') ? 'USD' : 'THB';
  LS.set('currency', CURR);
  render();
  toast(CURR==='USD' ? 'Showing prices in USD' : 'Showing prices in THB');
}
function fixCurrency(html){
  if(CURR!=='USD') return html;
  return html.replace(/(<[^>]*>)|([^<]+)/g, function(all,tag,text){
    if(tag) return tag;
    return text.replace(/\u0e3f\s*([\d,]+(?:\.\d+)?)(?:\s*[\u2013-]\s*([\d,]+(?:\.\d+)?))?/g, function(m,n1,n2){
      var a=parseFloat(n1.replace(/,/g,''));
      if(n2){ var b=parseFloat(n2.replace(/,/g,'')); return usd(a)+'\u2013'+usd(b).slice(1); }
      return usd(a);
    });
  });
}
function hm(mins){ mins=((mins%1440)+1440)%1440; var h=Math.floor(mins/60),m=mins%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function toMin(hhmm){ var p=String(hhmm).split(':'); return (+p[0])*60+(+p[1]); }
function clockStr(d){ var p=bkkFields(d); return p.hour+':'+p.minute; }
function homeClock(d){
  try{ return new Intl.DateTimeFormat('en-US',{timeZone:HOME_TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d||new Date()); }
  catch(e){ return '—'; }
}
function dur(ms){
  if(ms<0) return null;
  var m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  if(d>0) return d+'d '+h+'h';
  if(h>0) return h+'h '+mm+'m';
  return mm+'m';
}

/* ---------- trip position ---------- */
function tripInfo(){
  var iso = bkkISO(), i = -1;
  for(var k=0;k<TRIP.days.length;k++){ if(TRIP.days[k].d===iso){ i=k; break; } }
  var depart = stamp(TRIP.depart.date, TRIP.depart.time);
  var arrive = stamp(TRIP.arrive.date, TRIP.arrive.time);
  var now = Date.now();
  return { iso:iso, idx:i, day:i>=0?TRIP.days[i]:null,
    before: now < arrive, after: now > depart,
    toDepart: depart-now, toArrive: arrive-now, departTs:depart, arriveTs:arrive };
}

/* ---------- WEATHER ----------
   Tier 1 live fetch → Tier 2 cached → Tier 3 embedded climatology.
   Tier 1 is blocked by the artifact sandbox's content policy; the same
   code fetches successfully when the file is served from a normal host. */
var W = { state:'loading', src:null, at:0, cur:null, hours:[], days:[], sunrise:null, sunset:null };

function climoFor(iso){
  var hrs=[], base = stamp(iso,'00:00');
  for(var h=0;h<24;h++){
    hrs.push({ ts:base+h*3600000, hour:h, temp:F(CLIMO.tempByHour[h]),
      feels: F(CLIMO.tempByHour[h] + (CLIMO.humidity>75?4:2)),
      pop:CLIMO.rainByHour[h], mm: CLIMO.rainByHour[h]>50?2.5:(CLIMO.rainByHour[h]>35?0.8:0),
      code: CLIMO.rainByHour[h]>55?80:(CLIMO.rainByHour[h]>35?3:2),
      uv: (h>=9&&h<=16)? Math.round(CLIMO.uvMax*(1-Math.abs(12.5-h)/5)) : 0 });
  }
  return hrs;
}
function sunTimes(iso){
  /* Bangkok late Sept: sunrise ~06:05, sunset ~18:16 on 22 Sep, drifting ~2 min
     earlier by 1 Oct. Linear interpolation from the 22 Sep anchor. */
  var day = Math.round((stamp(iso,'12:00') - stamp('2026-09-22','12:00'))/86400000);
  return { sunrise: hm(365 + Math.round(day*0.45)), sunset: hm(1096 - Math.round(day*0.55)) };
}
function loadClimo(){
  var iso = bkkISO();
  W.hours = climoFor(iso);
  var st = sunTimes(iso);
  W.sunrise = st.sunrise; W.sunset = st.sunset;
  var h = bkkHour();
  W.cur = { temp:F(CLIMO.tempByHour[h]), feels:F(CLIMO.tempByHour[h]+4), hum:CLIMO.humidity,
            pop:CLIMO.rainByHour[h], mm:0, code:CLIMO.rainByHour[h]>55?80:2, wind:CLIMO.windAvg, uv:0 };
  W.days = TRIP.days.map(function(d){
    var s = sunTimes(d.d);
    return { d:d.d, max: F(d.d<'2026-10-01'?32:33), min:F(25), pop: d.d<'2026-10-01'?62:55,
             mm: 7, uv:CLIMO.uvMax, sunrise:s.sunrise, sunset:s.sunset,
             code: 80, wind:CLIMO.windAvg };
  });
  if(W.state!=='live'){ W.state='climo'; W.src='Embedded September climatology'; }
}
function cacheWx(){ LS.set('wx',{at:Date.now(),cur:W.cur,hours:W.hours,days:W.days,sunrise:W.sunrise,sunset:W.sunset}); }
function fetchWx(){
  var url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m'+
    '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,uv_index'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,uv_index_max,sunrise,sunset,wind_speed_10m_max'+
    '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=Asia%2FBangkok&forecast_days=10';
  var ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var killer = setTimeout(function(){ try{ ctl && ctl.abort(); }catch(e){} }, 8000);
  return fetch(url, ctl?{signal:ctl.signal}:{})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){
      clearTimeout(killer);
      if(!j || !j.current || !j.hourly) throw new Error('shape');
      W.cur = { temp:Math.round(j.current.temperature_2m), feels:Math.round(j.current.apparent_temperature),
        hum:Math.round(j.current.relative_humidity_2m), mm:j.current.precipitation||0,
        code:j.current.weather_code, wind:Math.round(j.current.wind_speed_10m), pop:null, uv:null };
      var H=j.hourly; W.hours=[];
      for(var i=0;i<H.time.length;i++){
        W.hours.push({ ts:Date.parse(H.time[i]+':00+07:00'), hour:+H.time[i].slice(11,13),
          temp:Math.round(H.temperature_2m[i]), feels:Math.round(H.apparent_temperature[i]),
          pop:H.precipitation_probability[i], mm:H.precipitation[i], code:H.weather_code[i],
          uv:H.uv_index?Math.round(H.uv_index[i]):0 });
      }
      var D=j.daily; W.days=[];
      for(var k=0;k<D.time.length;k++){
        W.days.push({ d:D.time[k], max:Math.round(D.temperature_2m_max[k]), min:Math.round(D.temperature_2m_min[k]),
          pop:D.precipitation_probability_max[k], mm:D.precipitation_sum[k], uv:Math.round(D.uv_index_max[k]),
          sunrise:D.sunrise[k].slice(11,16), sunset:D.sunset[k].slice(11,16), code:D.weather_code[k],
          wind:Math.round(D.wind_speed_10m_max[k]) });
      }
      var today = W.days.filter(function(x){return x.d===bkkISO();})[0];
      if(today){ W.sunrise=today.sunrise; W.sunset=today.sunset; }
      var nowH = nowHour(); if(nowH){ W.cur.pop=nowH.pop; W.cur.uv=nowH.uv; }
      W.state='live'; W.src='Open-Meteo'; W.at=Date.now(); cacheWx();
      return true;
    })
    .catch(function(){ clearTimeout(killer); return false; });
}
function nowHour(){
  var t=Date.now(), best=null;
  for(var i=0;i<W.hours.length;i++){
    if(W.hours[i].ts<=t && (!best || W.hours[i].ts>best.ts)) best=W.hours[i];
  }
  return best || W.hours[0] || null;
}
function hoursAhead(n){
  var t=Date.now()-3600000;
  return W.hours.filter(function(h){return h.ts>=t;}).slice(0,n);
}
function dayWx(iso){
  for(var i=0;i<W.days.length;i++) if(W.days[i].d===iso) return W.days[i];
  return null;
}

/* ---------- MODE RESOLVER ---------- */
var MODES = {
  NORMAL:{k:'NORMAL',cls:'m-NORMAL',lbl:'NORMAL'},
  DRY:{k:'DRY',cls:'m-DRY',lbl:'DRY WINDOW'},
  RAIN:{k:'RAIN',cls:'m-RAIN',lbl:'RAIN'},
  HEAVY:{k:'HEAVY',cls:'m-HEAVY',lbl:'HEAVY RAIN'},
  HEAT:{k:'HEAT',cls:'m-HEAT',lbl:'EXTREME HEAT'}
};
function manualWx(){
  var m = LS.get('manualwx',null);
  if(m && Date.now()-m.at < 3*3600000) return m.v;
  return null;
}
function currentMode(){
  var man = manualWx();
  if(man==='heavy') return {m:MODES.HEAVY, msg:'You told the app it is pouring. Indoor plans only.', manual:true};
  if(man==='rain')  return {m:MODES.RAIN,  msg:'You told the app it is raining. Covered options first.', manual:true};
  if(man==='hot')   return {m:MODES.HEAT,  msg:'You told the app it is brutally hot. Minimising walking.', manual:true};
  if(man==='good')  return {m:MODES.DRY,   msg:'You told the app conditions are good. Everything is open to you.', manual:true};

  var nh = nowHour(); if(!nh) return {m:MODES.NORMAL, msg:'Conditions unknown.'};
  var next = hoursAhead(4);
  var maxPop = 0, sumMm = 0;
  next.forEach(function(h){ if(h.pop>maxPop) maxPop=h.pop; sumMm += (h.mm||0); });
  var feels = (W.cur && W.cur.feels) || nh.feels;

  if(sumMm >= 6 || (maxPop>=85 && sumMm>=3))
    return {m:MODES.HEAVY, msg:'Heavy rain in the next few hours ('+inch(sumMm)+'). Stay covered.'};
  if(maxPop >= 55 || sumMm >= 1)
    return {m:MODES.RAIN, msg:'Rain likely — '+maxPop+'% within 4 hours. Have the covered backup ready.'};
  if(feels >= 100)
    return {m:MODES.HEAT, msg:'Feels like '+feels+'°F. Short hops, air conditioning, drink constantly.'};
  var h = bkkHour();
  if(maxPop < 25 && h>=14 && h<=19)
    return {m:MODES.DRY, msg:'Dry window — only '+maxPop+'% rain risk. Take the outdoor plan now.'};
  return {m:MODES.NORMAL, msg:'No significant rain signal in the next 4 hours.'};
}

/* ---------- SUNSET ENGINE ---------- */
function sunsetPlan(zoneKey){
  var iso = bkkISO(), dw = dayWx(iso);
  var ss = (dw && dw.sunset) || W.sunset || sunTimes(iso).sunset;
  var ssMin = toMin(ss);
  var tr = TRAVEL[zoneKey] || TRAVEL.hotel;
  var arrive = ssMin - 45;                 /* be seated 45 min before sunset */
  var leave  = arrive - tr.max - 10;       /* worst-case travel + 10 min buffer */
  return { sunset:ss, arrive:hm(arrive), leave:hm(leave), travel:tr.max+' min', mode:tr.mode };
}

/* ---------- DEPARTURE GUARD (1 October) ---------- */
function departPlan(){
  var ft = LS.get('flighttime', TRIP.depart.time);
  var fMin = toMin(ft);
  var airport = fMin - 180;      /* be at BKK 3 hours before an international departure */
  var hotel   = airport - 60 - 15; /* 60 min Thursday-evening run + 15 min buffer */
  var prep    = hotel - 45;
  return { flight:ft, airportBy:hm(airport), leaveHotel:hm(hotel), prepFrom:hm(prep),
           fTs:stamp(TRIP.depart.date, ft), hTs:stamp(TRIP.depart.date, hm(hotel)),
           pTs:stamp(TRIP.depart.date, hm(prep)) };
}
function departState(){
  var t = tripInfo();
  if(t.iso !== TRIP.depart.date) return {phase:'none'};
  var dp = departPlan(), now = Date.now();
  if(now >= dp.hTs) return {phase:'LEAVE', dp:dp};
  if(now >= dp.pTs) return {phase:'PREP',  dp:dp};
  return {phase:'CLEAR', dp:dp};
}

/* ---------- DECISION ENGINE ---------- */
function isOpenAt(p, atMin, dow){
  if(!p.open || !p.close) return true;
  if(p.days && p.days.indexOf(dow)===-1) return false;
  var o=toMin(p.open), c=toMin(p.close);
  return atMin>=o && atMin<=c-15;
}
function wxOk(p, wx){
  if(!p.wx) return true;
  return p.wx.indexOf(wx)!==-1;
}
function decide(where, minutes, wx, mood){
  var dow = bkkDow(), nowM = bkkMin();
  var pool = PLACES.slice();
  var scored = [];
  pool.forEach(function(p){
    var tr = TRAVEL[p.zone] || TRAVEL.hotel;
    var out = (where===p.zone) ? 3 : tr.max;
    var need = out*2 + p.dur;
    if(need > minutes + 15) return;                       /* cannot physically fit */
    var arriveAt = nowM + out;
    if(!isOpenAt(p, arriveAt, dow)) return;               /* shut by the time you get there */
    if(!wxOk(p, wx)) return;                              /* wrong weather */
    var s = 0;
    if(mood && p.mood.indexOf(mood)!==-1) s += 40;
    if(where===p.zone) s += 22; else s += Math.max(0, 20 - tr.max/3);
    s += Math.max(0, 18 - (need/minutes)*18);             /* comfortable fit beats a tight one */
    if(wx==='rain'||wx==='heavy'){ if(p.kind.indexOf('spa')>-1||p.kind.indexOf('culture')>-1) s+=14; }
    if(wx==='hot'){ if(p.kind.indexOf('spa')>-1||p.kind.indexOf('culture')>-1) s+=10; }
    var close = p.close?toMin(p.close):1440;
    if(close - arriveAt < p.dur + 20) s -= 25;            /* closing too soon to enjoy */
    scored.push({p:p, s:s, out:out, need:need, arriveAt:arriveAt, tr:tr});
  });
  scored.sort(function(a,b){return b.s-a.s;});
  return scored.slice(0,3);
}

var KIND = {
  temple:{i:'temple_buddhist',c:'violet'}, culture:{i:'museum',c:'pink'},
  food:{i:'restaurant',c:'amber'},        spa:{i:'spa',c:'teal'},
  river:{i:'sailing',c:'blue'},           view:{i:'landscape',c:'blue'},
  park:{i:'park',c:'teal'},               photo:{i:'photo_camera',c:'pink'},
  rooftop:{i:'local_bar',c:'coral'},      bar:{i:'local_bar',c:'coral'},
  market:{i:'storefront',c:'amber'}

function kindMeta(kinds){
  for(var i=0;i<kinds.length;i++) if(KIND[kinds[i]]) return KIND[kinds[i]];
  return {i:'place',c:'blue'};

function blockMeta(name){
  var n=name.toLowerCase();
  if(/shrine|wat |temple|palace|mount/.test(n)) return KIND.temple;
  if(/dinner|lunch|breakfast|eat|restaurant|tea room|supanniga|baan ice|sala/.test(n)) return KIND.food;
  if(/rooftop|red sky|octave|bar/.test(n)) return KIND.rooftop;
  if(/massage|spa|health land/.test(n)) return KIND.spa;
  if(/river|boat|ferry|arun/.test(n)) return KIND.river;

}

function setFlight(v){
  var m=/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(String(v).replace(/\u00A0/g,' ').trim());
  if(!m){ toast('Use a time like 9:00 PM'); return; }
  var h=+m[1], mn=+m[2], ap=m[3]&&m[3].toUpperCase();
  if(ap){ if(h<1||h>12){ toast('Use a time like 9:00 PM'); return; } h=h%12; if(ap==='PM') h+=12; }
  if(h>23||mn>59){ toast('Use a time like 9:00 PM'); return; }
  LS.set('flighttime',(h<10?'0':'')+h+':'+(mn<10?'0':'')+mn); render();
}

  });
  out += '</div></section>';

  out += '<section class="sec"><div class="sechead"><h2>Money</h2><span class="n">THB / USD</span></div>'+
    '<div class="card"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">'+

    [[100,'A coffee, water and a snack'],[500,'Grand Palace entry, or a decent rooftop cocktail'],
     [1000,'A good Thai dinner for one with a drink'],[2000,'A full evening: dinner, drinks and two Grabs'],
     [5000,'A big night, or two days of everything']].map(function(r){
      return '<tr><td class="num"><b>'+thbRef(r[0])+'</b></td><td class="num">'+usd(r[0])+'</td><td class="tiny">'+r[1]+'</td></tr>'; }).join('')+
    '</tbody></table></div><p class="src" style="margin-top:9px">'+TRIP.fx.src+', '+TRIP.fx.asOf+'. Rates move daily — an anchor, not a quote.</p></div>'+
    '<div class="stack-s" style="margin-top:12px">'+
    '<details open><summary><span class="media sm g-teal">'+mi('wallet','sm fill')+'</span><span class="sumtxt">How much cash tonight?</span></summary>'+
    '<div class="dbody"><div class="stack-s">'+MONEY.tonight.map(function(m){

function chk(id,v){

function renderPhrases(q){

    return '<div class="card pad-s"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">'+

var MENU=[
 {g:'Navigate', items:[
  {k:'home',l:'Home',s:'Dashboard, weather, what\u2019s next',i:'home',c:'blue'},

 ]}
];

    mi('chevron_right','chev')+'</button>'+
    '<div class="menuitem" style="cursor:default">'+
    '<span class="media sm g-coral">'+mi('flight_takeoff','sm fill')+'</span>'+

  h += '<div class="card"><p class="tiny"><b>Trip status.</b> '+

    '</p><p class="src" style="margin-top:8px">Checklists and journal entries are stored in this browser only. '+

function closeMenu(){ var v=$('#menuview'); if(!v) return; v.hidden=true; v.innerHTML='';
  document.body.style.overflow=''; }
function closeSOS(){ var v=$('#sosview'); v.hidden=true; v.innerHTML=''; document.body.style.overflow=''; }

/* =====================================================================
   NAV + BOOT
   ===================================================================== */
/* Five destinations on the phone bottom bar; Explore sits raised in the
   centre, unlabeled, like a primary FAB. On a wide screen the bar is hidden
   entirely and the same five destinations live behind the header's
   hamburger menu instead — see openMenu(). */
var TABS=[
 {k:'home',l:'Home',i:'home'},
 {k:'itinerary',l:'Itinerary',i:'event_note'},
 {k:'explore',l:'Explore',i:'explore',fab:true},
 {k:'around',l:'Around',i:'travel_explore'},
 {k:'ready',l:'Ready',i:'task_alt'}
];
var CUR='home';

/* Legacy and cross-linked view names fold onto the five real destinations,
   so any in-page button written against the old structure keeps working. */
var GOALIAS = {
  today:'itinerary', plan:'itinerary',
  wx:'home',
  food:{tab:'around', hub:'around', sub:'food'},
  move:{tab:'around', hub:'around', sub:'move'},
  safe:{tab:'ready', hub:'ready', sub:'safety'},
  prep:{tab:'ready', hub:'ready', sub:'prep'}
};
function go(k){
  var a = GOALIAS[k];
  if(a){
    if(typeof a==='object'){ SUBSEL[a.hub]=a.sub; LS.set('sub_'+a.hub,a.sub); k=a.tab; }
    else k=a;
  }
  closeMenu();
  CUR=k; LS.set('tab',k); render(); window.scrollTo(0,0);
}
function renderTabs(){
  var strip=$('#tabscroll');
  strip.innerHTML = TABS.map(function(t){
    if(t.fab){
      return '<button class="tab fab" role="tab" aria-selected="'+(CUR===t.k)+'" aria-label="'+t.l+'" '+
        'onclick="go(\''+t.k+'\')"><span class="fabin">'+mi(t.i,'fill')+'</span></button>';
    }
    return '<button class="tab" role="tab" aria-selected="'+(CUR===t.k)+'" onclick="go(\''+t.k+'\')">'+
      mi(t.i)+'<span class="lbl">'+t.l+'</span></button>'; }).join('');
}
var MODEICON={NORMAL:'partly_cloudy_day',DRY:'wb_sunny',RAIN:'rainy',HEAVY:'thunderstorm',HEAT:'local_fire_department'};
function renderChrome(){
  var md=currentMode(), t=tripInfo(), cur=W.cur||{}, nh=nowHour();
  $('#clk').textContent = t12(clockStr());
  $('#wxmini').textContent = (cur.temp!=null? ' · '+cur.temp+'°' : '');
  var strip=$('#modestrip');
  strip.className='modestrip m-'+md.m.cls.slice(2);
  $('#modeicon').textContent = MODEICON[md.m.k]||'cloud';
  $('#modelbl').textContent = md.m.lbl;
  $('#modemsg').textContent = md.msg;
  $('#tripday').textContent = t.day ? ('Day '+(t.idx+1)+' of 5')
    : (t.before ? 'T-'+(dur(t.toArrive)||'—') : 'Complete');
}
function render(){
  renderChrome(); renderTabs();
  var v=$('#view'), h='';
  try{
  if(CUR==='home') h=vHome();
  else if(CUR==='itinerary') h=vItinerary();
  else if(CUR==='explore') h=vExplore();
  else if(CUR==='around') h=vAround();
  else if(CUR==='ready') h=vReady();
  else { CUR='home'; h=vHome(); }
  }catch(err){
    h = '<div class="alert">'+mi('error')+'<div class="cbody"><b>This screen failed to load.</b>'+
        '<p class="tiny" style="margin-top:6px">'+esc(err && err.message ? err.message : String(err))+'</p>'+
        '<p class="tiny" style="margin-top:8px">Every other screen still works, and the Emergency button is unaffected.</p>'+
        '</div></div>';
  }
  v.innerHTML=fixCurrency(fixTimes(h));
  /* Sub-lists render into placeholders after the view is in the DOM. */
  if(CUR==='around' && SUBSEL.around==='food'){ renderFoodList(); renderDishList(''); }
  if(CUR==='ready' && SUBSEL.ready==='prep'){ renderPhrases(''); }
}
/* Material Symbols renders through ligatures: "home" becomes one glyph. If the
   font is missing, the browser prints the word instead. document.fonts.check()
   is NOT a usable test here — it reports true when the family falls back — so
   measure instead: with the icon font active, "home" collapses to a single
   glyph and is dramatically narrower than four monospace letters. */
function iconsActive(){
  try{
    var measure=function(family){
      var el=document.createElement('span');
      el.textContent='home';
      el.style.cssText='position:absolute;left:-9999px;top:-9999px;font-size:48px;'+
                       'white-space:nowrap;visibility:hidden;font-family:'+family;
      document.body.appendChild(el);
      var w=el.offsetWidth; el.parentNode.removeChild(el); return w;
    };
    var withIcons=measure('"Material Symbols Rounded",monospace');
    var plain=measure('monospace');
    return withIcons>0 && plain>0 && Math.abs(withIcons-plain)>4;
  }catch(e){ return false; }
}
function initIcons(){
  var ok=function(){ document.documentElement.classList.add('mi-ok'); };
  var attempt=function(){ if(iconsActive()){ ok(); return true; } return false; };
  if(attempt()) return;
  var tries=0, iv=setInterval(function(){ if(attempt()||++tries>20) clearInterval(iv); },250);
  try{
    if(document.fonts && document.fonts.ready && document.fonts.ready.then)
      document.fonts.ready.then(attempt)['catch'](function(){});
  }catch(e){}
}
function applyTheme(){
  var t=LS.get('theme',null);
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  var cur=LS.get('theme',null);
  var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var next = cur===null ? (sysDark?'light':'dark') : (cur==='dark'?'light':'dark');
  LS.set('theme',next); applyTheme();
}
function boot(){
  initIcons();
  applyTheme();
  loadClimo();
  var cached = LS.get('wx',null);
  if(cached && Date.now()-cached.at < 6*3600000){
    W.cur=cached.cur; W.hours=cached.hours; W.days=cached.days;
    W.sunrise=cached.sunrise; W.sunset=cached.sunset;
    W.state='cache'; W.at=cached.at; W.src='cached';
  }
  CURR = LS.get('currency','THB');
  if(CURR!=='USD') CURR='THB';
  SUBSEL.around = LS.get('sub_around','food');
  if(['food','move'].indexOf(SUBSEL.around)===-1) SUBSEL.around='food';
  SUBSEL.ready = LS.get('sub_ready','safety');
  if(['safety','prep'].indexOf(SUBSEL.ready)===-1) SUBSEL.ready='safety';
  CUR = LS.get('tab','home');
  if(['home','itinerary','explore','around','ready'].indexOf(CUR)===-1) CUR='home';
  render();

  $('#sosbtn').addEventListener('click', function(){ closeMenu(); openSOS(); });
  $('#themebtn').addEventListener('click', toggleTheme);
  var mb=$('#menubtn'); if(mb) mb.addEventListener('click', openMenu);
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    if(!$('#sosview').hidden) closeSOS();
    else if(!$('#menuview').hidden) closeMenu();
  });

  var lastISO = bkkISO(), lastMin = bkkMin();
  setInterval(function(){
    var iso=bkkISO(), m=bkkMin();
    var c=$('#bigclock'); if(c) c.textContent=t12(clockStr());
    $('#clk').textContent=t12(clockStr());
    if(iso!==lastISO){ lastISO=iso; lastMin=m; VIEWDAY=null; render(); return; }
    /* Only Home re-renders on a tick — Today holds journal textareas. */
    if(m!==lastMin){ lastMin=m; renderChrome(); if(CUR==='home') render(); }
  }, 20000);

  if(typeof fetch==='function'){
    fetchWx().then(function(ok){
      if(ok){ render(); setInterval(function(){ fetchWx().then(function(o){ if(o) render(); }); }, 15*60*1000); }
    });
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
